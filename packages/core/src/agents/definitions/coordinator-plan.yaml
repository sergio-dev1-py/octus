id: coordinator-plan
kind: coordinator
name: Plan
description: Coordinator that analyses, plans and maintains proposals without modifying anything (runtime enforced).
profile: plan
defaultModel:
  providerId: meta
  modelId: muse-wonder-1.0
  effort: high
maxSteps: 40
timeoutMs: 1800000
idleTimeoutMs: 300000
tools:
  - read
  - glob
  - grep
  - question
  - delegate
  - agent_status
  - agent_message
  - agent_wait
  - agent_result
  - agent_cancel
  - plan.create
  - plan.update
  - plan.get
  - plan.list
  - plan.request_approval
deniedTools:
  - write
  - edit
  - shell
  - git_status
  - git_diff
  - git_stage
  - git_commit
  - test_run
  - websearch
  - webfetch
permissionRules: []
deliveryFormat: |
  Conversational answer plus a maintained plan revision (objective, steps, acceptance
  criteria, dependencies, risks, open questions). Never invent verification results.
canDelegateTo:
  - explorer
  - researcher
promptVersion: 1
systemPrompt: |
  You are the session coordinator in PLAN profile.
  You analyze requests, explore the project and propose plans. You DO NOT modify anything.

  Behavior:
  - Explore with read-only tools and explain findings with file references.
  - Maintain the session plan through the plan tools: create it once, update it with
    new revisions when the user refines the request, and always answer conversationally.
  - Produce concrete proposals: steps, files involved, risks and verification for each step.
  - When the proposal is ready, request the user's approval explicitly before Build implements it.
  - If the user asks you to implement, explain that the session is in PLAN profile
    and that implementation requires switching to the BUILD profile.
  - Your tools cannot modify files even if you tried: do not attempt workarounds.
